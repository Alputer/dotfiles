config-version = 2

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

persistent-workspaces = ['B', 'S', 'C', 'T']

after-startup-command = [
    'exec-and-forget open -a "Brave Browser"',
    'exec-and-forget open -a Slack',
    'exec-and-forget open -a Cursor',
    'exec-and-forget open -a WezTerm',
]

on-window-detected = [
    # B - Browser
    {
        if = 'test %{app-bundle-id} = com.brave.Browser',
        run = 'move-node-to-workspace B',
    },
    # S - Slack
    {
        if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap',
        run = 'move-node-to-workspace S',
    },
    # C - Cursor
    {
        if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92',
        run = 'move-node-to-workspace C',
    },
    # T - Terminal (WezTerm)
    {
        if = 'test %{app-bundle-id} = com.github.wez.wezterm',
        run = 'move-node-to-workspace T',
    },
]

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

alt-left = 'resize width -50'
alt-right = 'resize width +50'
alt-up = 'resize height -50'
alt-down = 'resize height +50'

alt-b = 'workspace B'
alt-s = 'workspace S'
alt-c = 'workspace C'
alt-t = 'workspace T'

alt-shift-b = 'move-node-to-workspace B; workspace B'
alt-shift-s = 'move-node-to-workspace S; workspace S'
alt-shift-c = 'move-node-to-workspace C; workspace C'
alt-shift-t = 'move-node-to-workspace T; workspace T'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'layout floating tiling'
alt-shift-space = 'balance-sizes'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-q = 'close'
alt-f = 'fullscreen'
alt-enter = 'exec-and-forget open -na WezTerm'
alt-r = 'flatten-workspace-tree'
alt-shift-r = 'reload-config'
