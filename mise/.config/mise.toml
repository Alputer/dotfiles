[tools]
# Languages
bun = "1.3.14"
deno = "2.9.4"
go = "1.26"
java = "25"
kotlin = "2.4.10"
lua = "5.5.0"
node = "24.18.1"
python = "3.14.6"
ruby = "4.0.6"
rust = "1.97.1"
swift = "6.3"
zig = "0.16.0"

# Cloud & Infrastructure
awscli = "2.36"
circleci = "1.0.47091"
gcloud = { version = "578.0.0", depends = ["python"] }
terraform = "1.15.8"
kubectl = "1.36.2"
helm = "4.2.3"
docker-cli = "29.7.1"

# Development tools
buck2 = "2026-08-01"
codex = "0.147.0"
gh = "2.96.0"
lazydocker = "0.25.2"
lazygit = "0.63.1"
neovim = "0.12.4"
stylua = "2.5.2"
starship = "1.26.0"
tree-sitter = "0.26.11"

# Everyday CLI utilities
bat = "0.26.1"
eza = "0.23.5"
fastfetch = "2.66.0"
fd = "10.4.2"
fzf = "0.74.1"
jq = "1.8.2"
ripgrep = "15.2.0"
zoxide = "0.10.0"

[env]
CLOUDSDK_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }
