config-version = 2

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

persistent-workspaces = ['1', '2', '3', '4']

# Notify SketchyBar when the focused workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Refresh workspace app icons when focus changes (open/close/move within a space)
on-focus-changed = [
    'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

# Catch newly detected windows so icons appear without waiting for a focus event
on-window-detected = [
    {
        if = 'true',
        run = ['exec-and-forget sketchybar --trigger aerospace_focus_change'],
    },
]

after-startup-command = [
    # Borders / SketchyBar detect an already-running process and won't double-start
    'exec-and-forget borders',
    'exec-and-forget sketchybar',
    # Place default apps on 1/2/3/4 only at startup (not on later manual launches)
    'exec-and-forget bash "$HOME/.config/aerospace/startup-apps.sh"',
]

# Prefer MSI when connected; otherwise use the built-in display
# (Must come after root keys — TOML nests everything under a [table] until the next one)
[workspace-to-monitor-force-assignment]
1 = ['MSI', 'built-in']
2 = ['MSI', 'built-in']
3 = ['MSI', 'built-in']
4 = ['MSI', 'built-in']

[gaps]
inner.horizontal = [{ monitor."MSI" = 12 }, 8]
inner.vertical   = [{ monitor."MSI" = 12 }, 8]
outer.left       = [{ monitor."MSI" = 12 }, 8]
outer.bottom     = [{ monitor."MSI" = 12 }, 8]
# Room for SketchyBar (height 34) + padding
outer.top        = [{ monitor."MSI" = 42 }, 8]
outer.right      = [{ monitor."MSI" = 12 }, 8]

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

alt-left = 'resize width -50'
alt-right = 'resize width +50'
alt-up = 'resize height -50'
alt-down = 'resize height +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

alt-shift-1 = 'move-node-to-workspace 1; workspace 1'
alt-shift-2 = 'move-node-to-workspace 2; workspace 2'
alt-shift-3 = 'move-node-to-workspace 3; workspace 3'
alt-shift-4 = 'move-node-to-workspace 4; workspace 4'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'layout floating tiling'
alt-shift-space = 'balance-sizes'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-q = 'close'
alt-f = 'fullscreen'
alt-enter = 'exec-and-forget open -na WezTerm'
alt-r = 'flatten-workspace-tree'
alt-shift-r = 'reload-config'
