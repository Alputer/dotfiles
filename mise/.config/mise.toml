[tools]
# Languages
bun = "1.3.14"
deno = "2.9.4"
go = "1.26"
java = "25"
kotlin = "2.4.10"
lua = "5.5.0"
node = "24.18.1"
python = "3.14.6"
ruby = "4.0.6"
rust = "1.97.1"
swift = "6.3"
zig = "0.16.0"

# Cloud & Infrastructure
awscli = "2.36"
circleci = "1.0.47091"
gcloud = { version = "578.0.0", depends = ["python"] }
terraform = "1.15.8"
kubectl = "1.36.2"
helm = "4.2.3"
docker-cli = "29.7.1"

# Development tools
act = "0.2.89"
buck2 = "2026-08-01"
codex = "0.158.0"
gh = "2.96.0"
lazydocker = "0.25.2"
lazygit = "0.63.1"
neovim = "0.12.4"
#opencode = "latest"
stylua = "2.5.2"
starship = "1.26.0"
tree-sitter = "0.26.11"

# Everyday CLI utilities
bat = "0.26.1"
bitwarden = "2026.9.0"
eza = "0.23.5"
fastfetch = "2.66.0"
fd = "10.4.2"
fzf = "0.74.1"
jq = "1.8.2"
ripgrep = "15.2.0"
zoxide = "0.10.0"

# Container runtimes and the Mac App Store CLI
colima = "0.10.3"
container = "1.5.0"
mas = "7.0.0"

[env]
CLOUDSDK_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true
lockfile = true

[dotfiles]
"~/.config/aerospace" = "~/dotfiles/aerospace/.config/aerospace"
"~/.config/borders" = "~/dotfiles/borders/.config/borders"
"~/.gitconfig" = "~/dotfiles/git/.gitconfig"
"~/.config/kanata" = "~/dotfiles/kanata/.config/kanata"
"~/.config/mise.toml" = "~/dotfiles/mise/.config/mise.toml"
"~/.config/mise.lock" = "~/dotfiles/mise/.config/mise.lock"
"~/.config/nvim" = "~/dotfiles/nvim/.config/nvim"
"~/.config/sketchybar" = "~/dotfiles/sketchybar/.config/sketchybar"
"~/.ssh/config" = "~/dotfiles/ssh/.ssh/config"
"~/.ssh/known_hosts" = "~/dotfiles/ssh/.ssh/known_hosts"
"~/.config/starship.toml" = "~/dotfiles/starship/.config/starship.toml"
"~/.config/wezterm" = "~/dotfiles/wezterm/.config/wezterm"
"~/.zshrc" = "~/dotfiles/zsh/.zshrc"
"~/.zshenv" = "~/dotfiles/zsh/.zshenv"


# Third-party Homebrew taps.
[bootstrap.brew.taps]
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"
"FelixKratz/formulae" = "https://github.com/FelixKratz/homebrew-formulae.git"

# Host packages, casks, and App Store apps.
[bootstrap.packages]
# Build dependencies used by mise-managed language runtimes.
"brew:autoconf" = "latest"
"brew:automake" = "latest"
"brew:pkg-config" = "latest"
"brew:libtool" = "latest"
"brew:libffi" = "latest"
"brew:openssl@3" = "latest"
"brew:zlib" = "latest"
"brew:gmp" = "latest"
"brew:libyaml" = "latest"
"brew:readline" = "latest"

# macOS integrations and shell plugins.
"brew:FelixKratz/formulae/borders" = "latest"
"brew:FelixKratz/formulae/sketchybar" = "latest"
"brew:kanata" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-history-substring-search" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

# GUI applications.
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-sketchybar-app-font" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:postman" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:shottr" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:zoom" = "latest"

# Xcode is installed manually in README step 4: `mas` is a mise tool now, so it
# is not on PATH while the packages phase runs.

# Login shell for this user.
[bootstrap.user]
login_shell = "/bin/zsh"

# macOS preferences (from archive/nix/darwin.nix system.defaults).
[bootstrap.macos.dock]
autohide = true
tilesize = 96
show_recents = false
apps = [
  "/System/Library/CoreServices/Finder.app",
  "/Applications/Brave Browser.app",
  "/Applications/Slack.app",
  "/Applications/Notion.app",
  "/Applications/WezTerm.app",
  "/Applications/WhatsApp.app",
  "/Applications/Bitwarden.app",
  "/Applications/Tailscale.app",
  "/Applications/Xcode.app",
  "/System/Applications/System Settings.app",
]

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.keyboard]
press_and_hold = false # ApplePressAndHoldEnabled = false
key_repeat = 5
initial_key_repeat = 25

[bootstrap.macos.trackpad]
tap_to_click = true # trackpad.Clicking = true

# Preferences without a friendly key use the raw `defaults` domains.
[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true

[bootstrap.macos.defaults."com.apple.dock"]
"mineffect" = "scale"
"minimize-to-application" = true

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf"
"_FXShowPosixPathInTitle" = true

# Touch ID for sudo (security.pam.services.sudo_local.touchIdAuth).
[bootstrap.files."/etc/pam.d/sudo_local"]
content = "auth       sufficient     pam_tid.so\n"
owner = "root"
group = "wheel"
mode = "0644"

# System-level settings mise cannot express declaratively. Guarded so repeated
# runs do not ask for sudo again once the machine is converged.
[tasks.bootstrap]
run = """
set -e

# Host name
if [ "$(/usr/sbin/scutil --get HostName 2>/dev/null || true)" != "alputer" ]; then
  sudo /usr/sbin/scutil --set ComputerName alputer
  sudo /usr/sbin/scutil --set LocalHostName alputer
  sudo /usr/sbin/scutil --set HostName alputer
fi

# Time zone
if [ "$(sudo /usr/sbin/systemsetup -gettimezone 2>/dev/null | awk '{print $NF}')" != "Europe/Istanbul" ]; then
  sudo /usr/sbin/systemsetup -settimezone Europe/Istanbul
fi

# Disable guest login
if [ "$(sudo /usr/bin/defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>/dev/null || echo 1)" != "0" ]; then
  sudo /usr/bin/defaults write /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false
fi

"""
